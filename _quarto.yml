project:
  type: default
  output-dir: _site

format:
  revealjs:
    theme: [default, styles.scss]
    width: 1600
    height: 900
    margin: 0.055
    center: false
    controls: true
    progress: true
    slide-number: c/t
    show-slide-number: all
    navigation-mode: linear
    transition: fade
    background-transition: fade
    hash: true
    history: false
    embed-resources: true
    footer: "José Vicente Ordóñez Yaguache · Defensa doctoral · USC · 2026"

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

lang: es